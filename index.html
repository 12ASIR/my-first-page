<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你好，我是小洛</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 42px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 { font-size: 26px; color: #333; margin-bottom: 6px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    .info {
      background: #f6f7fb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 14px;
      color: #555;
      line-height: 1.8;
    }
    .info b { color: #333; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 30px;
      font-size: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102,126,234,0.5);
    }
    .footer { margin-top: 20px; font-size: 12px; color: #bbb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">洛</div>
    <h1>你好，我是小洛</h1>
    <p class="subtitle">一个正在从零学全栈的普通人</p>
    <div class="info">
      <div>📚 在学：<b>《零到全栈》课程</b></div>
      <div>💻 技术栈：<b>Next.js · FastAPI · Python</b></div>
      <div>🚀 目标：<b>把自己的项目搬到服务器上</b></div>
    </div>
    <a class="btn" href="mailto:luoyi@example.com">联系我</a>
    <div class="footer">这是我的第一张名片网页 · 双击就能打开</div>
  </div>
</body>
</html>
